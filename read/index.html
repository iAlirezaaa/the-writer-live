<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>کتابخانهٔ آثار | The Writer</title>
  <meta name="description" content="کتابخانهٔ آثار نویسنده؛ جلدهای اختصاصی، مطالعهٔ آرام و ادامه از آخرین صفحه.">
  <link rel="stylesheet" href="../web/style.css">
  <link rel="stylesheet" href="../web/book.css">
</head>
<body class="reader-page">
  <header class="top reading-top">
    <div class="reading-heading">
      <span class="reading-eyebrow">THE WRITER <span aria-hidden="true">/</span> LIBRARY</span>
      <h1>کتابخانهٔ داستان‌ها</h1>
      <p id="reader-note" class="muted small">هر داستان یک کتاب است. از جلد انتخاب کنید، ورق بزنید و هر زمان خواستید از همان صفحه ادامه دهید.</p>
    </div>
    <a id="home-link" class="reading-home" href="/">بازگشت به جهان نویسنده <span aria-hidden="true">↗</span></a>
  </header>
  <main class="grid reading-main">
    <section class="card reading-collection" aria-label="مجموعهٔ داستان‌ها">
      <div class="reading-collection-head">
        <div>
          <span class="reading-section-kicker">COLLECTION / 01</span>
          <h2>آثار روی قفسه</h2>
        </div>
        <span id="shelf-count" class="reading-total" role="status" aria-live="polite">در حال بارگذاری</span>
      </div>
      <div class="reader-shelf-tools" aria-label="جست‌وجو و مرتب‌سازی کتاب‌ها">
        <label class="reader-search-label">جست‌وجو در کتابخانه
          <input id="story-search" type="search" placeholder="نام اثر یا گونهٔ داستان…" autocomplete="off">
        </label>
        <label>وضعیت اثر
          <select id="story-status"><option value="all">همهٔ آثار</option><option value="accepted">پذیرفته‌شده‌ها</option><option value="rejected">ردشده‌ها</option></select>
        </label>
        <label>مرتب‌سازی
          <select id="story-sort"><option value="newest">تازه‌ترین</option><option value="oldest">قدیمی‌ترین</option><option value="title">نام اثر</option><option value="score">امتیاز منتقد</option></select>
        </label>
      </div>
      <div class="covers" id="covers" aria-label="جلد کتاب‌ها"></div>
      <p class="reading-endnote">هر جلد از شناسهٔ خود داستان ساخته می‌شود؛ رنگ و طراحی آن با مرتب‌سازی تغییر نمی‌کند.</p>
    </section>
  </main>
  <script type="module" src="../web/read.js"></script>
</body>
</html>
