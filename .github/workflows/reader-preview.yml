name: Reader discovery previews
on:
  push:
    branches: [main, "reader/**"]
    paths: ["web/library-preview.*", "web/read.html", "read/index.html", "tests/reader-preview*", ".github/workflows/reader-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and authorized revision checks
        run: node --test tests/reader-preview.test.cjs
      - name: Install pinned browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Preview interactions and visual evidence
        env:
          CAPTURE_READER_REFERENCE: '1'
        run: node tests/reader-preview-browser.cjs
      - name: Upload screenshots and honest reference-capture outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-discovery-previews
          path: reader-preview-artifacts/
          retention-days: 14
