name: Acquire Overture writer-block building roofprints
on:
  push:
    branches: [main]
    paths:
      - "city/survey/acquire-writer-block-overture.py"
      - "city/tests/test_writer_block_overture.py"
      - ".github/workflows/city-writer-block-overture-source.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: writer-block-overture-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Overture bounded downloader and robust polygon clipper
        run: |
          python -m pip install --disable-pip-version-check "overturemaps>=0.10,<1" "shapely>=2,<3"
      - name: Run offline source and immutable-house-scope tests
        run: python -m unittest discover -s city/tests -p 'test_writer_block_overture.py' -v
      - name: Acquire real building roofprints for ONLY the licensed writer block
        run: python city/survey/acquire-writer-block-overture.py
      - name: Validate no off-block geometry or undocumented heights
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from shapely.geometry import Polygon, Point
          d=json.loads(Path('city/survey/output/writer-block-overture-buildings.json').read_text('utf8'))
          s=json.loads(Path('city/survey/output/writer-block-survey.json').read_text('utf8'))
          b=Polygon(s['blockBoundary']['localXZ'][0:-1])
          assert d['license']=='ODbL-1.0'
          assert d['homeAnchor']=={'lat':35.715361987616696,'lon':51.3642455031707,'localX':0,'localZ':0}
          assert d['counts']['inBlock']==len(d['buildings'])
          assert d['counts']['inBlock'] <= 800
          for building in d['buildings']:
              assert building['id'] and building['ringsLocalXZ']
              for ring in building['ringsLocalXZ']:
                  p=Polygon(ring)
                  assert p.is_valid and p.area>=2.5
                  assert b.buffer(0.02).covers(p), f"Off-block roofprint: {building['id']}"
                  assert all(abs(x)<150 and abs(z)<120 for x,z in ring)
          print('WRITER-BLOCK-OVERTURE-VALIDATED',d['counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: writer-block-overture-real-roofprints
          path: city/survey/output/writer-block-overture-buildings.json
          retention-days: 30
      - name: Commit public licensed source evidence only (no rendering)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city/survey/output/writer-block-overture-buildings.json
          if ! git diff --cached --quiet; then
            git commit -m "city: capture licensed Overture writer-block building roofprints"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
