name: Capture OSM writer-block baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "city/survey/*.mjs"
      - "city/tests/writer-block-survey.test.mjs"
      - ".github/workflows/city-writer-block-survey.yml"
permissions:
  contents: write
concurrency:
  group: writer-block-survey
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify spatial projection and source/licensing contract
        run: node --test city/tests/writer-block-survey.test.mjs
      - name: Acquire bounded OpenStreetMap ways (read-only source API)
        run: node city/survey/acquire-writer-block.mjs --radius 230 --out city/survey/output/writer-block-survey.json
      - name: Enforce source confidence and provenance
        run: |
          node --input-type=module -e "
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('city/survey/output/writer-block-survey.json','utf8'));
          if(x.license!=='ODbL-1.0'||!['UNVERIFIED','OSM_CENTERLINE_CANDIDATE'].includes(x.blockBoundary.status)||x.totals.roads<1||
             !Number.isFinite(Date.parse(x.capturedAt))||!x.features.features.every(f=>f.id.startsWith('osm:way:')))
             process.exit(1);
          if(x.blockBoundary.status==='OSM_CENTERLINE_CANDIDATE'&&
             (!(x.blockBoundary.areaSquareMeters>100)||x.blockBoundary.roadWayIds.length<3||!x.blockBoundary.requiresSurvey))
             process.exit(1);
          console.log('SURVEY-SOURCE-OK',JSON.stringify({totals:x.totals,source:x.endpoint,base:x.osmBaseTimestamp}));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: writer-block-osm-survey
          path: city/survey/output/writer-block-survey.json
          retention-days: 30
      - name: Commit an ODbL-attributed snapshot without changing runtime geometry
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add city/survey/output/writer-block-survey.json
          if git diff --cached --quiet; then
            echo "OSM snapshot unchanged"
          else
            git commit -m "city: record attributed OSM writer-block survey snapshot"
            git push
          fi
