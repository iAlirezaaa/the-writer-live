name: Reader reference capture
on:
  push:
    branches: ["reader/reference-exact-20261112"]
    paths: [".github/workflows/reader-reference-capture.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'iAlirezaaa/the-writer-live'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Capture public reference without changing it
        run: |
          cat > capture.cjs <<'NODE'
          const fs=require('node:fs/promises'),path=require('node:path'),crypto=require('node:crypto');
          const {chromium}=require('playwright');
          (async()=>{
            await fs.mkdir('reference/assets',{recursive:true});
            const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const report={url:'https://library.jjangik.kr/',captured:new Date().toISOString(),browser:browser.version(),states:[],assets:[],failures:[]};
            const pending=[],saved=new Set();
            try{
              for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
                const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,hasTouch:name==='mobile',isMobile:name==='mobile',timezoneId:'Europe/Amsterdam'});
                const page=await context.newPage();const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                page.on('requestfailed',r=>report.failures.push({url:r.url(),error:r.failure()?.errorText}));
                page.on('response',response=>{
                  const url=response.url();if(saved.has(url)||response.status()!==200||!url.startsWith('https://library.jjangik.kr/'))return;
                  saved.add(url);pending.push((async()=>{try{const bytes=await response.body();if(bytes.length>6000000)return;
                    const hash=crypto.createHash('sha256').update(bytes).digest('hex');const ext=path.extname(new URL(url).pathname)||'.html';
                    const file='assets/'+hash.slice(0,16)+ext;await fs.writeFile('reference/'+file,bytes);
                    report.assets.push({url,file,bytes:bytes.length,sha256:hash,type:response.headers()['content-type']});
                  }catch(e){report.failures.push({url,error:String(e)})}})());
                });
                let response=null;
                try{response=await page.goto(report.url,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(12000);}catch(e){report.failures.push({state:name,error:String(e)});}
                await page.screenshot({path:'reference/'+name+'.png',fullPage:true}).catch(()=>{});
                await fs.writeFile('reference/'+name+'.html',await page.content());
                const state=await page.evaluate(()=>({title:document.title,url:location.href,text:document.body.innerText,viewport:{w:innerWidth,h:innerHeight},scroll:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},controls:[...document.querySelectorAll('button,a,input,select,[role="button"]')].map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,id:e.id,cls:e.className,text:e.textContent,aria:e.getAttribute('aria-label'),href:e.getAttribute('href'),rect:{x:r.x,y:r.y,w:r.width,h:r.height},display:s.display,visibility:s.visibility}}),canvases:[...document.querySelectorAll('canvas')].map(e=>({id:e.id,width:e.width,height:e.height})),scripts:[...document.scripts].map(e=>({src:e.src,type:e.type})),styles:[...document.querySelectorAll('link[rel="stylesheet"]')].map(e=>e.href)}));
                state.name=name;state.status=response?.status();state.errors=errors;report.states.push(state);
                for(const y of [height*.75,height*1.5]){await page.evaluate(y=>scrollTo(0,y),y);await page.waitForTimeout(500);await page.screenshot({path:'reference/'+name+'-scroll-'+Math.round(y)+'.png'});}
                await Promise.allSettled(pending);await context.close();
              }
            }finally{await browser.close();await fs.writeFile('reference/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report.states.map(s=>({name:s.name,status:s.status,title:s.title,canvas:s.canvases.length,controls:s.controls.length})),null,2));}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-reference-evidence
          path: reference/
          retention-days: 3
