name: Reference room browser verification
on:
  push:
    branches: ["reader/**", main]
    paths: ["web/reference-room/**", "reader/**", "tests/reader-reference-*.cjs", "tools/stage_reference_room.py", "tools/materialize_reference_room.py", "tools/serve_reference_room.py", "tests/test_reference_room_pull.py", ".github/workflows/reader-reference-room.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reference-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  room:
    if: github.repository == 'iAlirezaaa/the-writer-live'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate reviewed bytes and source syntax
        run: |
          python3 tools/stage_reference_room.py
          node --input-type=module --check < web/reference-room/room.js
          test -f reader/index.html
          grep -q '../web/read.js' reader/index.html
          node --check tests/reader-reference-room.cjs
          node --check tests/reader-reference-entry.cjs
      - name: Verify fresh private-pull asset hydration and safe localhost preview
        run: python3 -m unittest discover -s tests -p 'test_reference_room_pull.py' -v
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Exercise empty notebooks and actual WebGL room
        run: node tests/reader-reference-room.cjs
      - name: Verify the actual canonical staged reader
        run: node tests/reader-reference-entry.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-room-browser
          path: reference-room-evidence/
          retention-days: 14
