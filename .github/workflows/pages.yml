name: Deploy living world
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public site with correct vehicle imports
        run: |
          mkdir -p _site
          cp -a index.html web read snapshot _site/
          touch _site/.nojekyll
          # Keep the reviewed city UI even if a local snapshot producer has an
          # outdated worktree. The next two scripts patch these exact assets.
          for name in citizens.js citizen-motion-library.js objects.js world.js town.js town-cars.js; do
            cp ".github/citizens-assets/$name" "_site/web/$name"
          done
          python3 .github/scripts/prepare_car_deploy.py _site
          # The snapshot exporter may copy stale reader files from a local checkout.
          # Always ship the reviewed, versioned reading assets from this repository.
          mkdir -p _site/read _site/web
          for name in book.css book.js read.js book-cover.js; do
            cp ".github/reader-assets/$name" "_site/web/$name"
          done
          cp .github/reader-assets/read.html _site/read/index.html
          python3 .github/scripts/prepare_reader_deploy.py _site
          python3 .github/scripts/prepare_citizens_deploy.py _site
          # Pin the complete observer shell AFTER legacy publishing safeguards.
          # The authoring data/API snapshots remain unchanged.
          python3 .github/scripts/prepare_observer_deploy.py _site
          for name in observer-ui persian-display; do
            cp "_site/web/$name.js" "/tmp/the-writer-observer-$name.mjs"
            node --check "/tmp/the-writer-observer-$name.mjs"
          done
          node tests/observatory_probe.mjs _site
          for name in citizens citizen-motion-library objects; do
            cp "_site/web/$name.js" "/tmp/the-writer-city-$name.mjs"
            node --check "/tmp/the-writer-city-$name.mjs"
          done
          node tests/citizens_v2_probe.mjs _site _site/snapshot/town.json
          node tests/city_traffic_probe.mjs _site _site/snapshot/town.json
          node tests/citizens_probe.mjs _site < _site/snapshot/town.json
          for name in book read book-cover; do
            cp "_site/web/$name.js" "/tmp/the-writer-reader-$name.mjs"
            node --check "/tmp/the-writer-reader-$name.mjs"
          done
          for name in town town-cars world; do
            cp "_site/web/$name.js" "/tmp/the-writer-$name.mjs"
            node --check "/tmp/the-writer-$name.mjs"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
