name: Deploy living world
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current public export and protected writer room
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_live_sync.py
          for file in web/*.js web/*.mjs web/interaction-library/*.js; do
            node --input-type=module --check < "$file"
          done
          node tests/civita_buildings_probe.mjs
          node tests/civita_details_probe.mjs
          node tests/civita_walks_probe.mjs
          node tests/civita_writer_home_section_probe.mjs
          node tests/civita_writer_location_probe.mjs .
          node tests/reader_page_curl_probe.mjs
          node --test tests/reader-library-experience.test.cjs tests/reader-catalog-reset.test.cjs tests/reader-feedback-transport.test.cjs tests/reader-position.test.mjs tests/book-session.test.cjs tests/shelf-behavior.test.cjs tests/reader-stage.test.mjs tests/reader-editorial.test.mjs
      - name: Stage reviewed frontend and existing authorized public snapshot
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a index.html web read snapshot _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          root=Path("_site")
          assert (root/"index.html").is_file()
          assert (root/"read/index.html").is_file()
          assert (root/"web/data/civita-dbt.json").is_file()
          assert (root/"web/data/civita-dem-inner.u16").is_file()
          assert (root/"web/page-curl.js").is_file()
          assert (root/"snapshot/stories.json").is_file()
          print("LIVE-ARTIFACT-READY: surveyed Civita, new library, approved snapshot")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow Pages artifact metadata indexing
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
