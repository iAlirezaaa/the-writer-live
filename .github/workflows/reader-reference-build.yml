name: Build empty reference room
on:
  push:
    branches: ["reader/reference-exact-20261112"]
    paths: ["tools/build_reference_room.py", ".github/workflows/reader-reference-build.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: reference-assets-${{ github.repository }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: "reader/reference-exact-20261112", fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: reader-complete-reference
          repository: iAlirezaaa/the-writer-live
          run-id: 43271282298
          github-token: ${{ github.token }}
          path: incoming-reference
      - name: Build reviewed empty-content asset
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.0.0
          python tools/build_reference_room.py incoming-reference web/reference-room/data
      - name: Commit generated asset without touching main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/reference-room/data/room.json.gz web/reference-room/data/room-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(reader): record measured room with empty notebook content'
            git fetch origin reader/reference-exact-20261112
            git rebase origin/reader/reference-exact-20261112
            git push origin HEAD:reader/reference-exact-20261112
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-room-compiled
          path: web/reference-room/data/
          retention-days: 14
