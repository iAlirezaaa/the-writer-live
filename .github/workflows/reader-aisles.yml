name: Reader adjoining cabinets
on:
  push:
    branches: [main, "reader/**"]
    paths: ["web/read.html", "read/index.html", "web/read.js", "web/library*.js", "web/library*.css", "web/book*.js", "web/book*.css", "web/reader-room.css", "web/interaction-library/index.html", "tests/reader-aisle*", ".github/workflows/reader-aisles.yml", ".github/scripts/verify_live_sync.py", ".github/live-sync-manifest.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-aisles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aisles:
    if: github.repository == 'iAlirezaaa/the-writer-live'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Packing, canonical routes and presentation contracts
        run: node --test tests/reader-aisle.test.mjs
      - name: Install pinned browser
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Real modules, adjoining cabinets, touch, titles and old entry routes
        run: node tests/reader-aisle-browser.cjs
      - name: Preserve visual and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-modern-aisles
          path: reader-aisle-artifacts/
          retention-days: 14
