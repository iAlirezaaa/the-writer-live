name: Tehran evidence tile index
on:
  push:
    branches: [main]
    paths:
      - 'city/survey/tehran-geotile-index.mjs'
      - 'city/tests/tehran-geotile-index.test.mjs'
      - '.github/workflows/city-tehran-geotiles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexed-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source identity, license and spatial index unit tests
        run: node --test city/tests/tehran-geotile-index.test.mjs
      - name: Index previously captured licensed OSM Tehran neighborhood snapshot
        run: |
          node city/survey/tehran-geotile-index.mjs \
            --input city/survey/output/writer-block-survey.json \
            --out /tmp/tehran-writer-block-tiles-z17.json --zoom 17
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const o=JSON.parse(readFileSync("/tmp/tehran-writer-block-tiles-z17.json"));
            if(o.featureCount<10||o.tileCount<1||!o.attribution||
              o.mode!=="provenance-metadata-only")process.exit(1);
            console.log("TEHRAN-GEOTILE-INDEX-OK",o.featureCount,o.tileCount);
          '
