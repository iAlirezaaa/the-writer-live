name: Observatory UI contract
on:
  push:
    branches: [main]
    paths:
      - "web/observer-ui.js"
      - "web/observer.css"
      - "web/persian-display.js"
      - "web/world.js"
      - "web/index.html"
      - "index.html"
      - "tests/observatory_probe.mjs"
      - ".github/scripts/verify_live_sync.py"
      - ".github/workflows/observatory-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current public Civita and protected author UI
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_live_sync.py
          node --input-type=module --check < web/observer-ui.js
          node --input-type=module --check < web/world.js
          python3 - <<'PY'
          from pathlib import Path
          page=Path("index.html").read_text(encoding="utf-8")
          world=Path("web/world.js").read_text(encoding="utf-8")
          observer=Path("web/observer-ui.js").read_text(encoding="utf-8")
          assert page.count("data-panel=")==15, "all observer panels must remain visible"
          assert all(x in page for x in ('id="observer-theme"','id="scene-data-link"', 'data-view="town"'))
          assert "writerInteriorWorldRoot" in world and "buildTown" in world
          assert "installPersianPresentation" in observer or "solarDate" in world
          print("PUBLIC-OBSERVATORY-CURRENT-UI-OK")
          PY
