name: Reader catalog focused tests
on:
  push:
    branches: [main]
    paths:
      - "web/book.js"
      - "web/book.css"
      - "web/read.js"
      - "web/read.html"
      - "web/library.css"
      - "web/reader-room.css"
      - "web/library-stage.js"
      - "web/page-curl.js"
      - "read/index.html"
      - "tests/reader_page_curl_probe.mjs"
      - "tests/reader-library-experience.test.cjs"
      - "tests/reader-position.test.mjs"
      - ".github/workflows/reader-catalog-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new integrated library and page-curl module syntax
        run: |
          set -euo pipefail
          for file in web/book.js web/read.js web/library-stage.js web/page-curl.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test current public bookshelf and full reader behavior
        run: |
          set -euo pipefail
          node --test tests/reader-library-experience.test.cjs
          node tests/reader_page_curl_probe.mjs
          node --test --experimental-default-type=module tests/reader-position.test.mjs
      - name: Ensure owner-authorized stories remain labeled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          book=Path("web/book.js").read_text(encoding="utf-8")
          reader=Path("web/read.js").read_text(encoding="utf-8")
          html=Path("read/index.html").read_text(encoding="utf-8")
          assert "owner_shared" in book and "owner_shared" in reader
          assert 'id="covers"' in html and "library.css" in html
          print("PUBLIC-READER-CURRENT-UI-OK")
          PY
