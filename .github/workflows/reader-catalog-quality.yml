name: Reader catalog focused tests
on:
  push:
    branches: [main]
    paths:
      - "web/book.js"
      - ".github/reader-assets/book.js"
      - "tests/reader-feedback-transport.test.cjs"
      - "web/read.js"
      - "web/interaction-library/reader-shelf-room.js"
      - "web/interaction-library/reader-shelf.css"
      - ".github/reader-assets/reader-shelf-room.js"
      - ".github/reader-assets/reader-shelf.css"
      - "web/read.html"
      - "web/book.css"
      - "read/index.html"
      - "web/reader-position.js"
      - "tests/reader-catalog-reset.test.cjs"
      - "tests/reader-library-experience.test.cjs"
      - "tests/reader-position.test.mjs"
      - "tests/test_reader_unicode_boundaries.cjs"
      - "tests/test_reader_unicode_controls.cjs"
      - ".github/reader-assets/read.js"
      - ".github/reader-assets/read.html"
      - ".github/workflows/reader-catalog-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse reader regression scripts before behavior tests
        run: |
          node --check tests/test_reader_unicode_boundaries.cjs
          node --check tests/test_reader_unicode_controls.cjs
          node --check tests/reader-catalog-reset.test.cjs
          node --check tests/reader-library-experience.test.cjs
          node --check tests/reader-feedback-transport.test.cjs
      - name: Catalog behavior and keyboard reset
        shell: bash
        run: |
          set -o pipefail
          node --test tests/reader-catalog-reset.test.cjs | tee reader-catalog-reset.tap
          node --test tests/reader-library-experience.test.cjs | tee reader-library-experience.tap
      - name: Execute reader vote and comment transports
        shell: bash
        run: |
          set -o pipefail
          node --test tests/reader-feedback-transport.test.cjs | tee reader-feedback-transport.tap
      - name: Persian Unicode normalization boundaries
        run: |
          node tests/test_reader_unicode_boundaries.cjs
          node tests/test_reader_unicode_controls.cjs
      - name: Stable passage resume after typography reflow
        shell: bash
        run: |
          set -o pipefail
          node --test --experimental-default-type=module tests/reader-position.test.mjs | tee reader-position.tap
      - name: Upload focused reader TAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-node-tap
          path: '*.tap'
          if-no-files-found: warn
          retention-days: 14
      - name: Parse production catalog module
        run: |
          cp web/read.js /tmp/reader-catalog-validated.mjs
          node --check /tmp/reader-catalog-validated.mjs
          node --check web/interaction-library/reader-shelf-room.js
